name: Frontend Jest + Teams Alert

on:
  push:

jobs:
  test-and-notify:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      - name: Run Jest tests
        id: jest
        run: |
          set +e
          npm test -- --watchAll=false 2>&1 | tee jest-output.txt
          test_exit_code=${PIPESTATUS[0]}

          suites_line=$(grep -E "^Test Suites:" jest-output.txt | tail -1)
          tests_line=$(grep -E "^Tests:" jest-output.txt | tail -1)
          time_line=$(grep -E "^Time:" jest-output.txt | tail -1)

          echo "exit_code=$test_exit_code" >> "$GITHUB_OUTPUT"
          echo "suites_line=${suites_line:-Test Suites: unavailable}" >> "$GITHUB_OUTPUT"
          echo "tests_line=${tests_line:-Tests: unavailable}" >> "$GITHUB_OUTPUT"
          echo "time_line=${time_line:-Time: unavailable}" >> "$GITHUB_OUTPUT"

          exit 0
        working-directory: frontend
        env:
          CI: true

      - name: Send Teams report on success
        if: ${{ steps.jest.outputs.exit_code == '0' }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URI: ${{ secrets.TEAMS_WEBHOOK_URI }}
        run: |
          webhook="$TEAMS_WEBHOOK_URL"
          if [ -z "$webhook" ]; then
            webhook="$TEAMS_WEBHOOK_URI"
          fi

          if [ -z "$webhook" ]; then
            echo "Teams webhook secret is missing. Set TEAMS_WEBHOOK_URL or TEAMS_WEBHOOK_URI."
            exit 0
          fi

          payload="{\"text\":\"✅ Jest Passed\\nRepository: ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nActor: ${{ github.actor }}\\nCommit: ${{ github.sha }}\\n${{ steps.jest.outputs.suites_line }}\\n${{ steps.jest.outputs.tests_line }}\\n${{ steps.jest.outputs.time_line }}\"}"

          curl -f -X POST "$webhook" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo "Teams success notification failed to send."

      - name: Send Teams report on failure
        if: ${{ steps.jest.outputs.exit_code != '0' }}
        env:
          TEAMS_WEBHOOK_URL: ${{ secrets.TEAMS_WEBHOOK_URL }}
          TEAMS_WEBHOOK_URI: ${{ secrets.TEAMS_WEBHOOK_URI }}
        run: |
          webhook="$TEAMS_WEBHOOK_URL"
          if [ -z "$webhook" ]; then
            webhook="$TEAMS_WEBHOOK_URI"
          fi

          if [ -z "$webhook" ]; then
            echo "Teams webhook secret is missing. Set TEAMS_WEBHOOK_URL or TEAMS_WEBHOOK_URI."
            exit 0
          fi

          payload="{\"text\":\"❌ Jest Failed\\nRepository: ${{ github.repository }}\\nBranch: ${{ github.ref_name }}\\nActor: ${{ github.actor }}\\nCommit: ${{ github.sha }}\\n${{ steps.jest.outputs.suites_line }}\\n${{ steps.jest.outputs.tests_line }}\\n${{ steps.jest.outputs.time_line }}\"}"

          curl -f -X POST "$webhook" \
            -H "Content-Type: application/json" \
            -d "$payload" || echo "Teams failure notification failed to send."

      - name: Keep workflow green after failure report
        if: ${{ steps.jest.outputs.exit_code != '0' }}
        run: echo "Jest failed. Failure report already sent to Teams."
